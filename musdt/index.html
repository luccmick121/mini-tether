<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Tether — Adicionar à carteira</title>
<link rel="icon" href="logo.png">
<meta property="og:title" content="Mini Tether (MUSDT) — Adicionar à carteira">
<meta property="og:description" content="MUSDT · ERC-20 · Ethereum">
<meta property="og:image" content="logo.png">
<style>
  :root{--teal:#26A17B;--dark:#0B1612;--soft:#7FBFA8}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--dark);color:#fff}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow-x:hidden}
  img.logo{width:88px;height:88px;border-radius:50%;margin-bottom:14px;box-shadow:0 0 24px rgba(38,161,123,.35)}
  h1{font-size:21px;margin-bottom:2px}
  p.sub{color:var(--soft);font-size:13px;margin-bottom:24px}
  button{width:100%;max-width:340px;padding:18px;border:none;border-radius:16px;background:var(--teal);color:#0B1612;font-size:17px;font-weight:800;cursor:pointer;margin-bottom:10px}
  button:active{transform:scale(.97)}
  #btn{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(38,161,123,.45)}50%{box-shadow:0 0 0 16px rgba(38,161,123,0)}}
  #btn.parado{animation:none;opacity:.55;cursor:not-allowed}
  #btnCopiar{background:transparent;border:1.5px solid rgba(127,191,168,.35);color:var(--soft);font-size:14px;font-weight:600;padding:14px;display:none}
  #st{font-size:13px;margin-top:16px;min-height:18px;color:var(--teal);padding:0 10px;line-height:1.5}
  #st.err{color:#EF0027}
  #st.info{color:var(--soft)}
  code{font-size:11px;color:var(--soft);word-break:break-all;margin-top:10px;display:block;line-height:1.5}
  .tiny{font-size:11px;color:#4f7a6a;margin-top:14px;max-width:340px;line-height:1.5}
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Mini Tether">
  <h1>Mini Tether</h1>
  <p class="sub">MUSDT · ERC-20 · Ethereum</p>
  <button id="btn">➕ Adicionar MUSDT à carteira</button>
  <button id="btnCopiar">📋 Copiar endereço do contrato</button>
  <div id="st"></div>
  <code id="enderecoTxt"></code>
  <div class="tiny" id="dica">A identidade real do ativo é o ENDEREÇO do contrato.</div>
  <div class="tiny" style="margin-top:10px">
    Mini Tether (MUSDT) · ERC-20 na Ethereum · Contrato: <span id="contratoRodape"></span><br>
    Contato oficial: <a href="mailto:luccmick121@gmail.com" style="color:inherit">luccmick121@gmail.com</a><br>
    <a href="https://github.com/luccmick121" style="color:inherit">GitHub</a> ·
    <a id="linkExplorer" href="#" style="color:inherit">Etherscan</a>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   TOKEN — dados do ativo
   ENDERECO: preenchido SÓ pós-deploy por `npm run prova:musdt -- --endereco 0x… --aplicar`
   (confere name/symbol/decimals/totalSupply em 2 RPCs e grava o endereço em checksum EIP-55:
   a EIP-747 diz "If the checksum fails, the request MUST be considered invalid"). Enquanto
   for o placeholder — ou qualquer valor que não seja 0x + 40 hex — a página fica ARMADA
   (não falha, só avisa). Nada de build/deploy por iniciativa própria (R30).
   LOGO: imagem PRÓPRIA derivada do design do USDT (cor + ângulo do T, fundo transparente) —
   NÃO é o arquivo do USDT; ver o comentário logo abaixo e scripts/gera-logo-musdt.py.
   ═══════════════════════════════════════════════════════════════════════ */
const ENDERECO = '0xdAC1CE1555793820103b2cf52aa08082825b1Ec7';
// LOGO: imagem PRÓPRIA, DERIVADA do design do USDT (mesma família visual:
// emblema circular + glifo T), com cor e ângulo do T alterados (gerada em
// assets/musdt/logo-derivado-master.png — técnica descrita em
// docs/dossie-usdt-flash/01-EXTRACAO-AUDIO.md [00:13:02] "põe ângulo no T").
// Bytes NECESSARIAMENTE diferentes do USDT real (mudar cor/posição muda os
// bytes sempre — não dá pra mudar a imagem e manter os bytes ao mesmo tempo).
// Hospedada por NÓS (não cabe mais hotlink no CDN da Trust — aquele serve o
// USDT ORIGINAL sem modificação, não a nossa versão derivada).
const LOGO     = 'https://gateway.pinata.cloud/ipfs/bafkreiabmvekqq6hbbdvq4k5kd3soyen5j4n7c4xlrvlkgzhuvbkxyi4zy';
const TOKEN    = {
  type: 'ERC20',
  // image = campo do EIP-747; logo/logoURI = aliases que algumas wallets procuram
  options: { address: ENDERECO, chainId: 1, symbol: 'MUSDT', decimals: 6, image: LOGO, logo: LOGO, logoURI: LOGO }
};
const ETHEREUM = {
  chainId: '0x1',
  chainName: 'Ethereum Mainnet',
  nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
  rpcUrls: ['https://ethereum-rpc.publicnode.com'],
  blockExplorerUrls: ['https://etherscan.io']
};

const elSt   = document.getElementById('st');
const elDica = document.getElementById('dica');
const st = (m, cls='') => { elSt.textContent = m; elSt.className = cls; };
const enderecoValido = () => /^0x[0-9a-fA-F]{40}$/.test(ENDERECO);
const pendente = () => !enderecoValido(); // placeholder OU endereço malformado: não deixa chamar o watchAsset
document.getElementById('enderecoTxt').textContent = pendente() ? '(contrato aguardando deploy — R30)' : ENDERECO;
elDica.textContent = pendente()
  ? 'Contrato ainda não deployado — esta página está armada e será preenchida pós-deploy.'
  : 'A identidade real do ativo é o ENDEREÇO do contrato: ' + ENDERECO + ' — confira no Etherscan antes de interagir.';
document.getElementById('contratoRodape').textContent = pendente() ? '(pendente)' : ENDERECO;
document.getElementById('linkExplorer').href = pendente() ? '#' : ('https://etherscan.io/token/' + ENDERECO);

/* ═══════════════════════════════════════════════════════════════════════
   DETECÇÃO DE DISPOSITIVO (mesma engenharia da página Bitcoin/USDT.z da casa)
   ═══════════════════════════════════════════════════════════════════════ */
const isMobile = /android|iphone|ipad|ipod|opera mini|iemobile|mobile/i.test(navigator.userAgent);
const deepLinkMetaMask = () => 'https://metamask.app.link/dapp/' + location.href.replace(/^https?:\/\//, '');

const nomeDe = (p) => {
  if (!p) return '';
  if (p.isMetaMask)  return 'MetaMask';
  if (p.isTrust || p.isTrustWallet) return 'Trust Wallet';
  if (p.isCoinbaseWallet) return 'Coinbase Wallet';
  if (p.isRabby)     return 'Rabby';
  if (p.isOkxWallet) return 'OKX Wallet';
  if (p.isBraveWallet) return 'Brave Wallet';
  return 'Carteira EVM';
};

/* EIP-6963 PRIMEIRO — o padrão oficial de anúncio de carteiras. */
function anunciar6963(msEspera = 700) {
  return new Promise((resolve) => {
    const achados = [];
    const onAnuncio = (ev) => { if (ev?.detail?.provider) achados.push(ev.detail); };
    window.addEventListener('eip6963:announceProvider', onAnuncio);
    window.dispatchEvent(new Event('eip6963:requestProvider'));
    setTimeout(() => {
      window.removeEventListener('eip6963:announceProvider', onAnuncio);
      window.__carteirasVistas = achados.map(a => a.info?.name || '?');
      resolve(achados);
    }, msEspera);
  });
}
/* Carteira alvo: ?carteira=trust|metamask|okx|bybit|… (sem o parâmetro, comportamento antigo). */
const ALVO = (new URLSearchParams(location.search).get('carteira') || '').toLowerCase().trim();
const combina = (a) => {
  const nome = (a.info?.name || '').toLowerCase();
  const rdns = (a.info?.rdns || '').toLowerCase();
  return ALVO && (nome.includes(ALVO) || rdns.includes(ALVO));
};
function escolherDosAnuncios(achados) {
  if (!achados.length) return null;
  window.__carteirasVistas = achados.map(a => a.info?.name || '?');
  // 1) pedido explícito na URL
  if (ALVO) {
    const alvo = achados.find(combina);
    if (alvo) return { provider: alvo.provider, nome: alvo.info?.name || ALVO, fonte: 'EIP-6963 (alvo)' };
    return { erro: 'carteira "' + ALVO + '" não anunciou. Vistas: ' + (window.__carteirasVistas.join(', ') || 'nenhuma') };
  }
  // 2) padrão: MetaMask, senão a primeira que anunciar
  const porRdns = achados.find(a => /metamask/i.test(a.info?.rdns || ''));
  const porNome = achados.find(a => /^metamask$/i.test((a.info?.name || '').trim()))
               || achados.find(a => /metamask/i.test(a.info?.name || ''));
  const esc = porRdns || porNome || achados[0];
  return { provider: esc.provider, nome: esc.info?.name || nomeDe(esc.provider), fonte: 'EIP-6963' };
}
async function acharProvider() {
  const achados = await anunciar6963();
  const via6963 = escolherDosAnuncios(achados);
  if (via6963?.erro) { st(via6963.erro, 'err'); return null; }
  if (via6963) return via6963;
  if (window.ethereum && typeof window.ethereum.request === 'function') {
    if (Array.isArray(window.ethereum.providers) && window.ethereum.providers.length) {
      const lista = window.ethereum.providers.filter(p => p && typeof p.request === 'function');
      if (lista.length) return { provider: lista[0], nome: nomeDe(lista[0]), fonte: 'providers[]' };
    }
    return { provider: window.ethereum, nome: nomeDe(window.ethereum), fonte: 'window.ethereum' };
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════════════════
   AÇÃO
   ═══════════════════════════════════════════════════════════════════════ */
document.getElementById('btnCopiar').addEventListener('click', async () => {
  if (pendente()) { st('Contrato ainda não deployado — endereço indisponível.', 'err'); return; }
  try {
    await navigator.clipboard.writeText(ENDERECO);
    st('✓ Endereço copiado. Cole em "Importar token" na sua carteira.', 'info');
  } catch (_) {
    st('Copie manualmente: ' + ENDERECO, 'info');
  }
});

document.getElementById('btn').addEventListener('click', async () => {
  const btn = document.getElementById('btn');
  if (pendente()) {
    st(/^PREENCHER/i.test(ENDERECO)
      ? 'O contrato ainda não foi deployado (R30 — ordem explícita do operador). Esta página está armada: preencha o endereço pós-deploy (npm run prova:musdt -- --endereco 0x… --aplicar).'
      : 'Endereço inválido no código desta página (esperado 0x + 40 hex) — corrija antes de publicar.', 'err');
    return;
  }
  btn.classList.add('parado');
  st('Procurando carteira…', 'info');

  const achado = await acharProvider();

  if (!achado) {
    document.getElementById('btnCopiar').style.display = 'block';
    if (isMobile) {
      st('No celular, a carteira não se conecta sozinha — abra pelo app. Toque abaixo:', 'info');
      btn.textContent = '🦊 Abrir na MetaMask (app)';
      btn.onclick = () => { location.href = deepLinkMetaMask(); };
      btn.classList.remove('parado');
      elDica.textContent = 'Ou toque em "Copiar endereço" e cole em Importar token dentro da sua carteira.';
    } else {
      const vistas = (window.__carteirasVistas || []).join(', ') || 'nenhuma';
      st('Nenhuma carteira EVM encontrada neste navegador. Carteiras vistas: ' + vistas +
         ' — se você usa MetaMask, confirme que a extensão está instalada e desbloqueada.', 'err');
      btn.textContent = '🔄 Tentar novamente';
      btn.onclick = () => location.reload();
    }
    return;
  }

  // ── Garante a CHAIN ATIVA antes do watchAsset (bug "no active chain info") ──
  async function garantirChain() {
    let atual = null;
    try { atual = await achado.provider.request({ method: 'eth_chainId' }); } catch (_) {}
    if (!atual) {
      try { await achado.provider.request({ method: 'eth_requestAccounts' }); } catch (_) {}
      try { atual = await achado.provider.request({ method: 'eth_chainId' }); } catch (_) {}
    }
    if (String(atual || '').toLowerCase() === ETHEREUM.chainId) return atual;
    try {
      await achado.provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ETHEREUM.chainId }] });
    } catch (err) {
      const m = String(err?.message || err);
      if (err?.code === 4902 || /unrecognized|not added|unknown/i.test(m)) {
        try { await achado.provider.request({ method: 'wallet_addEthereumChain', params: [ETHEREUM] }); } catch (_) {}
        try { await achado.provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ETHEREUM.chainId }] }); } catch (_) {}
      }
    }
    try { return await achado.provider.request({ method: 'eth_chainId' }); } catch (_) { return null; }
  }

  try {
    const chain = await garantirChain();
    const res = await achado.provider.request({ method: 'wallet_watchAsset', params: TOKEN });
    // Trust/Binance/OKX devolvem undefined no sucesso — SÓ `false` significa recusa
    if (res !== false) {
      st('✓ MUSDT adicionado com a logo em ' + achado.nome + ' (chain ' + (chain || '?') + ')!', '');
      btn.textContent = '✓ Adicionado';
    } else {
      st('A carteira recusou. Toque de novo para tentar.', 'err');
      btn.textContent = '➕ Adicionar MUSDT à carteira';
      btn.classList.remove('parado');
    }
  } catch (e) {
    const msg = String(e?.message || e);
    const recusa = e?.code === 4001 || /user rejected|recusad|denied/i.test(msg);
    if (recusa) {
      st('Você recusou na carteira. Toque de novo para tentar.', 'err');
      btn.textContent = '➕ Adicionar MUSDT à carteira';
      btn.classList.remove('parado');
      return;
    }
    if (/chain|network|4902/i.test(msg)) {
      try {
        await garantirChain();
        const res2 = await achado.provider.request({ method: 'wallet_watchAsset', params: TOKEN });
        if (res2 !== false) { st('✓ MUSDT adicionado com a logo!', ''); btn.textContent = '✓ Adicionado'; return; }
      } catch (_) { /* segue pro fallback */ }
    }
    document.getElementById('btnCopiar').style.display = 'block';
    st('Não foi possível adicionar automaticamente (' + achado.nome + '): ' + msg.slice(0, 90) + ' — use "Copiar endereço" e importe o token manualmente.', 'err');
    btn.textContent = '🔄 Tentar novamente';
    btn.onclick = () => location.reload();
  }
});

window.addEventListener('eip6963:announceProvider', () => {}, { once: true });
</script>
</body>
</html>
